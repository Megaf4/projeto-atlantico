<!DOCTYPE html>
<html>
<head>
    <title>Teste de Imagens da Galeria</title>
    <style>
        body { 
            font-family: Arial; 
            padding: 20px; 
            background: #0E1A2B; 
            color: white;
        }
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .test-card {
            background: #223A5E;
            border: 2px solid #8FB3FF;
            border-radius: 10px;
            padding: 15px;
        }
        .test-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 5px;
            background: #15253F;
        }
        .url { 
            font-size: 11px; 
            color: #8FB3FF; 
            word-break: break-all;
            margin-top: 10px;
        }
        .status {
            margin-top: 10px;
            padding: 5px;
            border-radius: 3px;
            font-size: 12px;
        }
        .success { background: #28a745; }
        .error { background: #dc3545; }
    </style>
</head>
<body>
    <h1>🧪 Teste de Carregamento de Imagens da Galeria</h1>
    <p>Este arquivo testa se as imagens estão sendo servidas corretamente pelo Next.js</p>
    
    <div id="stats"></div>
    <div class="test-grid" id="grid"></div>

    <script>
        const testeUrls = [
            '/images/4S ENGENHARIA/FOTOS/DSC07680.JPG',
            '/images/AT&T ENERGIA S.A/DSC06399.JPG',
            '/images/SABESP 2022/DSC01344.JPG',
            '/images/outras empresas/WhatsApp Image 2020-12-03 at 14.50.37.jpeg',
            '/images/PUBLICO/Imagem do WhatsApp de 2025-05-06 à(s) 12.48.12_b8d0ef37.jpg',
            '/images/AGEO/DSC05015.JPG',
            '/images/TBG/DSC00150.JPG',
            '/images/outro hd/DSC03251.JPG',
            '/images/BTP/DSC03888.JPG',
            '/images/LOG-IN_PROINDE/DSC02717.JPG'
        ];

        let sucessos = 0;
        let erros = 0;
        const grid = document.getElementById('grid');

        testeUrls.forEach(url => {
            const card = document.createElement('div');
            card.className = 'test-card';
            
            const img = document.createElement('img');
            img.src = url;
            
            const urlDiv = document.createElement('div');
            urlDiv.className = 'url';
            urlDiv.textContent = 'URL: ' + url;
            
            const statusDiv = document.createElement('div');
            statusDiv.className = 'status';
            statusDiv.textContent = '⏳ Carregando...';
            
            img.onload = () => {
                statusDiv.className = 'status success';
                statusDiv.textContent = '✅ Carregada com sucesso!';
                sucessos++;
                updateStats();
            };
            
            img.onerror = () => {
                statusDiv.className = 'status error';
                statusDiv.textContent = '❌ Erro ao carregar (404 ou caminho inválido)';
                erros++;
                updateStats();
            };
            
            card.appendChild(img);
            card.appendChild(urlDiv);
            card.appendChild(statusDiv);
            grid.appendChild(card);
        });

        function updateStats() {
            document.getElementById('stats').innerHTML = `
                <div style="background: #15253F; padding: 15px; border-radius: 10px; margin-bottom: 20px;">
                    <h2>📊 Estatísticas</h2>
                    <p>✅ <strong>Sucesso:</strong> ${sucessos} imagens</p>
                    <p>❌ <strong>Erro:</strong> ${erros} imagens</p>
                    <p>📦 <strong>Total testado:</strong> ${testeUrls.length} imagens</p>
                </div>
            `;
        }

        updateStats();
    </script>
</body>
</html>
